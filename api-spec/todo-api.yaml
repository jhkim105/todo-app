openapi: 3.0.3
info:
  title: Todo App API Specification
  description: OpenAPI 3.0 specification for the multi-backend development Todo Application.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Spring Boot Kotlin Backend
  - url: http://localhost:8000
    description: Python FastAPI Backend
paths:
  /api/categories:
    get:
      summary: Get all categories
      operationId: getCategories
      responses:
        '200':
          description: A list of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      summary: Create a new category
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'

  /api/categories/{id}:
    delete:
      summary: Delete a category
      operationId: deleteCategory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Category deleted successfully

  /api/tasks:
    get:
      summary: Get all tasks
      operationId: getTasks
      parameters:
        - name: categoryId
          in: query
          description: Filter tasks by category ID
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      summary: Create a new task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

  /api/tasks/{id}:
    put:
      summary: Update an existing task
      operationId: updateTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
    delete:
      summary: Delete a task
      operationId: deleteTask
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Task deleted successfully

components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        color:
          type: string
          description: Hex color string (e.g. #FF5733)
      required:
        - id
        - name
        - color

    CategoryRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
      required:
        - name
        - color

    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
          nullable: true
        completed:
          type: boolean
        dueDate:
          type: string
          format: date-time
          nullable: true
        priority:
          $ref: '#/components/schemas/Priority'
        category:
          $ref: '#/components/schemas/Category'
          nullable: true
      required:
        - id
        - title
        - completed
        - priority

    TaskRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        completed:
          type: boolean
        dueDate:
          type: string
          format: date-time
          nullable: true
        priority:
          $ref: '#/components/schemas/Priority'
        categoryId:
          type: integer
          format: int64
          nullable: true
      required:
        - title
        - completed
        - priority

    Priority:
      type: string
      enum:
        - LOW
        - MEDIUM
        - HIGH
