packages:
  - 'frontend/react'
  - 'backends/nestjs'

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': set this to true or false
  prisma: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "unrs-resolver"
